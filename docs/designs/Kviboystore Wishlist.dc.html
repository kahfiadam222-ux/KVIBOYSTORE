<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-48d314f0-355a-4c97-840b-9cf683fad669/styles.css">
  <script src="_ds/modernist-48d314f0-355a-4c97-840b-9cf683fad669/_ds_bundle.js"></script>
  <style>
    [data-theme] { --accent-ink: var(--color-accent-700); background: var(--color-bg); color: var(--color-text); min-height: 100vh; }
    [data-theme="dark"] {
      --color-bg: #17181a;
      --color-surface: #212226;
      --color-text: #f2f0ee;
      --color-divider: color-mix(in srgb, #f2f0ee 16%, transparent);
      --accent-ink: var(--color-accent-300);
    }
    [data-theme] a { color: #fff; }
    [data-theme] a:hover { color: #fff; }
    [data-theme] .nav a { color: inherit; }
    [data-theme] .nav a:hover, [data-theme] .nav a[aria-current='page'] { color: var(--color-accent); }
    [data-theme] .input { background: var(--color-surface); color: var(--color-text); }
    [data-theme] .btn-primary { color: #fff; }
    [data-theme] .btn-secondary { color: var(--color-text); }
    [data-theme] .nav a, [data-theme] .nav .nav-brand { color: var(--color-text); opacity: 1; }
    [data-theme] .nav a:hover, [data-theme] .nav a[aria-current='page'] { color: var(--color-accent); opacity: 1; }
    [data-theme].theme-ready *, [data-theme].theme-ready *::before, [data-theme].theme-ready *::after {
      transition: background-color .55s cubic-bezier(.16,1,.3,1), color .55s cubic-bezier(.16,1,.3,1), border-color .55s cubic-bezier(.16,1,.3,1);
    }
    @keyframes riseIn { from { opacity: 0; transform: translate3d(0,14px,0); } to { opacity: 1; transform: translate3d(0,0,0); } }
    .anim-rise { opacity: 0; will-change: transform, opacity; animation: riseIn 0.6s cubic-bezier(.16,1,.3,1) forwards; }
    .card-tile { will-change: transform; transition: transform 0.35s cubic-bezier(.16,1,.3,1); border-radius: 12px; }
    .card-tile:hover { transform: translate3d(0,-4px,0); }
    .card-tile:hover .card-tile-img { transform: scale(1.045); }
    .card-tile-img { will-change: transform; transition: transform 0.45s cubic-bezier(.16,1,.3,1); }
    .btn { transition: all 0.25s cubic-bezier(.16,1,.3,1); }
    .btn:hover { transform: translateY(-1px); }
    @media (prefers-reduced-motion: reduce) {
      .anim-rise { animation: none; opacity: 1; }
      [data-theme] *, [data-theme] *::before, [data-theme] *::after, .btn, .card-tile, .card-tile-img { transition: none !important; }
    }
  </style>
</helmet>

<div data-theme="{{ theme }}" class="{{ themeReadyClass }}">
  <div style="display:flex; align-items:stretch; min-height:100vh">
    <dc-import name="Sidebar" active="wishlist" is-admin-user="{{ false }}" hint-size="236px,100vh"></dc-import>
    <div style="flex:1; min-width:0">
      <nav class="nav">
        <span class="nav-brand">Kviboystore</span>
        <a href="Kviboystore Katalog.dc.html">Katalog</a>
        <a href="#" aria-current="page">Wishlist</a>
        <div style="display:flex; align-items:center; gap:8px; margin-left:auto">
          <button type="button" class="btn btn-secondary btn-icon" aria-label="Ganti tema" onClick="{{ toggleTheme }}">
            <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </sc-if>
            <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </sc-if>
          </button>
          <button type="button" class="btn btn-primary">Masuk</button>
        </div>
      </nav>

      <section style="max-width:1200px; margin:0 auto; padding:56px 32px">
        <h1 class="anim-rise" style="font-size:clamp(28px,4vw,44px); line-height:1.1; margin:0 0 8px; animation-delay:0.04s">Wishlist saya</h1>
        <p class="anim-rise" style="font-size:15px; opacity:0.72; margin:0 0 32px; animation-delay:0.08s">{{ itemCount }} produk tersimpan</p>

        <sc-if value="{{ hasItems }}" hint-placeholder-val="{{ true }}">
          <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px">
            <sc-for list="{{ wishlistItems }}" as="p" hint-placeholder-count="6">
              <div class="card card-tile anim-rise" style="border:1px solid var(--color-divider); gap:0; padding:0; overflow:hidden; animation-delay:0.1s; position:relative">
                <figure class="grayscale" style="margin:0; position:relative; overflow:hidden">
                  <div class="card-tile-img" style="width:100%; aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg, var(--color-accent-200), var(--color-accent-100)); font-size:48px">📦</div>
                  <button type="button" class="btn btn-secondary btn-icon" style="position:absolute; top:8px; right:8px; width:32px; height:32px; background:var(--color-surface)" onClick="{{ p.onRemove }}" aria-label="Hapus dari wishlist">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                  </button>
                </figure>
                <div style="padding:14px; display:flex; flex-direction:column; gap:8px; flex:1">
                  <p class="card-title" style="font-size:15px; margin:0">{{ p.title }}</p>
                  <p style="font-size:12.5px; opacity:0.65; margin:0">{{ p.type }}</p>
                  <p style="font-size:18px; font-weight:800; margin:4px 0 0; color:#ff6b4d">{{ p.price }}</p>
                  <sc-if value="{{ p.inStock }}" hint-placeholder-val="{{ true }}">
                    <button type="button" class="btn btn-primary btn-block" style="margin-top:8px">Beli sekarang</button>
                  </sc-if>
                  <sc-if value="{{ p.outOfStock }}" hint-placeholder-val="{{ false }}">
                    <button type="button" class="btn btn-secondary btn-block" style="margin-top:8px; opacity:0.6" disabled>Stok habis</button>
                  </sc-if>
                </div>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="text-align:center; padding:64px 24px; border:2px solid var(--color-divider); border-radius:12px">
            <div style="font-size:56px; margin-bottom:16px">❤️</div>
            <h2 style="font-size:20px; margin:0 0 8px">Wishlist kosong</h2>
            <p style="font-size:14px; opacity:0.65; margin:0 0 20px">Mulai tambahkan produk favorit untuk disimpan di sini.</p>
            <a href="Kviboystore Katalog.dc.html" class="btn btn-primary">Jelajahi katalog</a>
          </div>
        </sc-if>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    theme: "light",
    themeReady: false,
    wishlistItems: [
      { id: "p2", title: "Streaming Musik Individual 1 Bulan", type: "Streaming Musik", price: "Rp 20.000", inStock: true },
      { id: "p4", title: "Cloud Storage 2TB Setahun", type: "Penyimpanan Cloud", price: "Rp 350.000", inStock: true },
      { id: "p5", title: "VPN Premium Tahunan", type: "Keamanan & VPN", price: "Rp 180.000", inStock: false },
      { id: "p6", title: "Voucher Top-Up Game", type: "Voucher Game", price: "Rp 50.000", inStock: true },
    ],
  };

  componentDidMount() {
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ themeReady: true })));
  }

  toggleTheme = () => {
    const flip = () => this.setState((s) => ({ theme: s.theme === "dark" ? "light" : "dark" }));
    if (document.startViewTransition) document.startViewTransition(flip);
    else flip();
  };

  removeItem = (id) => {
    if (!confirm("Hapus dari wishlist?")) return;
    this.setState((s) => ({
      wishlistItems: s.wishlistItems.filter((item) => item.id !== id),
    }));
  };

  renderVals() {
    const items = this.state.wishlistItems;
    const itemsWithHandlers = items.map((item) => ({
      ...item,
      outOfStock: !item.inStock,
      onRemove: () => this.removeItem(item.id),
    }));

    return {
      theme: this.state.theme,
      themeReadyClass: this.state.themeReady ? "theme-ready" : "",
      isDark: this.state.theme === "dark",
      isLight: this.state.theme === "light",
      toggleTheme: this.toggleTheme,
      wishlistItems: itemsWithHandlers,
      hasItems: items.length > 0,
      isEmpty: items.length === 0,
      itemCount: items.length,
    };
  }
}
</script>
</body>
</html>
