<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-48d314f0-355a-4c97-840b-9cf683fad669/styles.css">
  <script src="_ds/modernist-48d314f0-355a-4c97-840b-9cf683fad669/_ds_bundle.js"></script>
  <style>
    [data-theme] { --accent-ink: var(--color-accent-700); background: var(--color-bg); color: var(--color-text); min-height: 100vh; }
    [data-theme="dark"] {
      --color-bg: #17181a;
      --color-surface: #212226;
      --color-text: #f2f0ee;
      --color-divider: color-mix(in srgb, #f2f0ee 16%, transparent);
      --accent-ink: var(--color-accent-300);
    }
    [data-theme] a { color: #fff; }
    [data-theme] a:hover { color: #fff; }
    [data-theme] .nav a { color: inherit; }
    [data-theme] .nav a:hover, [data-theme] .nav a[aria-current='page'] { color: var(--color-accent); }
    [data-theme] .input { background: var(--color-surface); color: var(--color-text); }
    [data-theme] .btn-primary { color: #fff; }
    [data-theme] .btn-secondary { color: var(--color-text); }
    [data-theme] .nav a, [data-theme] .nav .nav-brand { color: var(--color-text); opacity: 1; }
    [data-theme] .nav a:hover, [data-theme] .nav a[aria-current='page'] { color: var(--color-accent); opacity: 1; }
    [data-theme].theme-ready *, [data-theme].theme-ready *::before, [data-theme].theme-ready *::after {
      transition: background-color .55s cubic-bezier(.16,1,.3,1), color .55s cubic-bezier(.16,1,.3,1), border-color .55s cubic-bezier(.16,1,.3,1);
    }
    @keyframes riseIn { from { opacity: 0; transform: translate3d(0,14px,0); } to { opacity: 1; transform: translate3d(0,0,0); } }
    .anim-rise { opacity: 0; will-change: transform, opacity; animation: riseIn 0.6s cubic-bezier(.16,1,.3,1) forwards; }
    .notif-item { border-left:4px solid var(--color-accent); padding:16px; background:var(--color-surface); border-radius:8px; transition: all 0.25s cubic-bezier(.16,1,.3,1); }
    .notif-item:hover { transform: translateX(4px); }
    .notif-item.unread { background:color-mix(in srgb, var(--color-accent) 10%, var(--color-surface)); }
    .btn { transition: all 0.25s cubic-bezier(.16,1,.3,1); }
    .btn:hover { transform: translateY(-1px); }
    @media (prefers-reduced-motion: reduce) {
      .anim-rise { animation: none; opacity: 1; }
      [data-theme] *, [data-theme] *::before, [data-theme] *::after, .btn, .notif-item { transition: none !important; }
    }
  </style>
</helmet>

<div data-theme="{{ theme }}" class="{{ themeReadyClass }}">
  <div style="display:flex; align-items:stretch; min-height:100vh">
    <dc-import name="Sidebar" active="beranda" is-admin-user="{{ false }}" hint-size="236px,100vh"></dc-import>
    <div style="flex:1; min-width:0">
      <nav class="nav">
        <span class="nav-brand">Kviboystore</span>
        <a href="Kviboystore Katalog.dc.html">Katalog</a>
        <a href="#" aria-current="page">Notifikasi</a>
        <div style="display:flex; align-items:center; gap:8px; margin-left:auto">
          <button type="button" class="btn btn-secondary btn-icon" aria-label="Ganti tema" onClick="{{ toggleTheme }}">
            <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </sc-if>
            <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </sc-if>
          </button>
          <button type="button" class="btn btn-primary">Masuk</button>
        </div>
      </nav>

      <section style="max-width:900px; margin:0 auto; padding:56px 32px">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:32px">
          <div>
            <h1 class="anim-rise" style="font-size:clamp(28px,4vw,44px); line-height:1.1; margin:0 0 8px; animation-delay:0.04s">Notifikasi</h1>
            <p class="anim-rise" style="font-size:15px; opacity:0.72; margin:0; animation-delay:0.08s">{{ unreadCount }} notifikasi belum dibaca</p>
          </div>
          <button type="button" class="btn btn-secondary" onClick="{{ markAllRead }}">Tandai semua dibaca</button>
        </div>

        <div style="display:flex; gap:12px; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--color-divider)">
          <sc-for list="{{ filterTabs }}" as="tab" hint-placeholder-count="3">
            <button type="button" class="btn {{ tab.btnClass }}" onClick="{{ tab.onClick }}">{{ tab.label }}</button>
          </sc-for>
        </div>

        <sc-if value="{{ hasNotifications }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex; flex-direction:column; gap:12px">
            <sc-for list="{{ filteredNotifications }}" as="notif" hint-placeholder-count="6">
              <div class="notif-item anim-rise {{ notif.unreadClass }}" style="animation-delay:0.1s; display:grid; grid-template-columns:1fr auto; gap:16px; align-items:start">
                <div style="display:flex; gap:12px">
                  <div style="width:40px; height:40px; border-radius:50%; background:color-mix(in srgb, var(--color-accent) 20%, var(--color-surface)); display:flex; align-items:center; justify-content:center; font-size:20px; flex-shrink:0">{{ notif.icon }}</div>
                  <div style="min-width:0">
                    <p style="font-weight:700; margin:0 0 4px; font-size:14px">{{ notif.title }}</p>
                    <p style="font-size:13px; opacity:0.72; margin:0 0 6px">{{ notif.message }}</p>
                    <p style="font-size:11px; opacity:0.55; margin:0">{{ notif.time }}</p>
                  </div>
                </div>
                <button type="button" class="btn btn-secondary btn-icon" style="width:28px; height:28px; flex-shrink:0" onClick="{{ notif.onClose }}" aria-label="Tutup">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
              </div>
            </sc-for>
          </div>
        </sc-if>
        <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
          <div style="text-align:center; padding:64px 24px">
            <div style="font-size:48px; margin-bottom:16px">🔔</div>
            <h2 style="font-size:18px; margin:0 0 8px">Tidak ada notifikasi</h2>
            <p style="font-size:13px; opacity:0.65; margin:0">Kamu sudah up-to-date dengan semua notifikasi.</p>
          </div>
        </sc-if>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    theme: "light",
    themeReady: false,
    activeFilter: "all",
    notifications: [
      { id: 1, type: "order", title: "Pesanan #ORD-2024-001 Selesai", message: "Streaming Video Premium sudah siap diakses. Cek akun Anda sekarang.", time: "2 jam lalu", icon: "✓", unread: true },
      { id: 2, type: "promo", title: "Promo spesial: Diskon 20% hari ini", message: "Lisensi produktivitas favorit Anda dengan harga istimewa. Berlaku sampai jam 24.00.", time: "4 jam lalu", icon: "🎉", unread: true },
      { id: 3, type: "status", title: "Pesanan #ORD-2024-002 Diproses", message: "Metode pembayaran Anda sudah dikonfirmasi. Akun akan dikirim sebentar lagi.", time: "6 jam lalu", icon: "⏳", unread: false },
      { id: 4, type: "wishlist", title: "Produk favorit Anda kembali stok", message: "VPN Premium Tahunan yang Anda inginkan sudah tersedia lagi.", time: "1 hari lalu", icon: "❤️", unread: false },
      { id: 5, type: "order", title: "Pesanan #ORD-2024-003 Dibatalkan", message: "Refund Anda sebesar Rp 50.000 sedang diproses. Cek dalam 1-3 hari kerja.", time: "2 hari lalu", icon: "↩️", unread: false },
      { id: 6, type: "promo", title: "Flash sale: Cloud Storage 50% off", message: "Hemat hingga Rp 175.000 untuk paket tahunan. Stok terbatas!", time: "3 hari lalu", icon: "⚡", unread: false },
    ],
  };

  componentDidMount() {
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ themeReady: true })));
  }

  toggleTheme = () => {
    const flip = () => this.setState((s) => ({ theme: s.theme === "dark" ? "light" : "dark" }));
    if (document.startViewTransition) document.startViewTransition(flip);
    else flip();
  };

  setFilter = (filter) => this.setState({ activeFilter: filter });
  markAllRead = () => this.setState(s => ({ notifications: s.notifications.map(n => ({ ...n, unread: false })) }));
  removeNotif = (id) => this.setState(s => ({ notifications: s.notifications.filter(n => n.id !== id) }));

  renderVals() {
    const filtered = this.state.activeFilter === "all"
      ? this.state.notifications
      : this.state.activeFilter === "unread"
      ? this.state.notifications.filter(n => n.unread)
      : this.state.notifications.filter(n => n.type === this.state.activeFilter);

    const filterTabs = [
      { label: "Semua", filter: "all", btnClass: this.state.activeFilter === "all" ? "btn-primary" : "btn-secondary" },
      { label: "Belum dibaca", filter: "unread", btnClass: this.state.activeFilter === "unread" ? "btn-primary" : "btn-secondary" },
      { label: "Pesanan", filter: "order", btnClass: this.state.activeFilter === "order" ? "btn-primary" : "btn-secondary" },
      { label: "Promo", filter: "promo", btnClass: this.state.activeFilter === "promo" ? "btn-primary" : "btn-secondary" },
    ].map(t => ({ ...t, onClick: () => this.setFilter(t.filter) }));

    const notifsWithHandlers = filtered.map(n => ({
      ...n,
      unreadClass: n.unread ? "unread" : "",
      onClose: () => this.removeNotif(n.id),
    }));

    const unreadCount = this.state.notifications.filter(n => n.unread).length;

    return {
      theme: this.state.theme,
      themeReadyClass: this.state.themeReady ? "theme-ready" : "",
      isDark: this.state.theme === "dark",
      isLight: this.state.theme === "light",
      toggleTheme: this.toggleTheme,
      unreadCount,
      markAllRead: this.markAllRead,
      filterTabs,
      filteredNotifications: notifsWithHandlers,
      hasNotifications: filtered.length > 0,
      isEmpty: filtered.length === 0,
    };
  }
}
</script>
</body>
</html>
