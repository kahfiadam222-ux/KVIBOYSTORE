<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-48d314f0-355a-4c97-840b-9cf683fad669/styles.css">
  <script src="_ds/modernist-48d314f0-355a-4c97-840b-9cf683fad669/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
  <style>
    [data-theme] { --accent-ink: var(--color-accent-700); background: var(--color-bg); color: var(--color-text); min-height: 100vh; }
    [data-theme="dark"] {
      --color-bg: #17181a;
      --color-surface: #212226;
      --color-text: #f2f0ee;
      --color-divider: color-mix(in srgb, #f2f0ee 16%, transparent);
      --accent-ink: var(--color-accent-300);
    }
    [data-theme] a { color: #fff; }
    [data-theme] a:hover { color: #fff; }
    [data-theme] .nav a { color: inherit; }
    [data-theme] .nav a:hover, [data-theme] .nav a[aria-current='page'] { color: var(--color-accent); }
    [data-theme] .input { background: var(--color-surface); color: var(--color-text); }
    [data-theme] .btn-primary { color: #fff; }
    [data-theme] .btn-secondary { color: var(--color-text); }
    [data-theme] .nav a, [data-theme] .nav .nav-brand { color: var(--color-text); opacity: 1; }
    [data-theme] .nav a:hover, [data-theme] .nav a[aria-current='page'] { color: var(--color-accent); opacity: 1; }
    [data-theme].theme-ready *, [data-theme].theme-ready *::before, [data-theme].theme-ready *::after {
      transition: background-color .55s cubic-bezier(.16,1,.3,1), color .55s cubic-bezier(.16,1,.3,1), border-color .55s cubic-bezier(.16,1,.3,1);
    }
    @keyframes riseIn { from { opacity: 0; transform: translate3d(0,14px,0); } to { opacity: 1; transform: translate3d(0,0,0); } }
    .anim-rise { opacity: 0; will-change: transform, opacity; animation: riseIn 0.6s cubic-bezier(.16,1,.3,1) forwards; }
    .card-tile { will-change: transform; transition: transform 0.35s cubic-bezier(.16,1,.3,1); border-radius: 12px; }
    .card-tile:hover { transform: translate3d(0,-4px,0); }
    .card-tile:hover .card-tile-img { transform: scale(1.045); }
    .card-tile-img { will-change: transform; transition: transform 0.45s cubic-bezier(.16,1,.3,1); }
    .btn { transition: all 0.25s cubic-bezier(.16,1,.3,1); }
    .btn:hover { transform: translateY(-1px); }
    .loading { opacity: 0.6; pointer-events: none; }
    .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--color-divider); border-top-color: var(--color-accent); border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .anim-rise { animation: none; opacity: 1; }
      [data-theme] *, [data-theme] *::before, [data-theme] *::after, .btn, .card-tile, .card-tile-img { transition: none !important; }
    }
  </style>
</helmet>

<div data-theme="{{ theme }}" class="{{ themeReadyClass }}">
  <div style="display:flex; align-items:stretch; min-height:100vh">
    <dc-import name="Sidebar" active="beranda" is-admin-user="{{ false }}" hint-size="236px,100vh"></dc-import>
    <div style="flex:1; min-width:0">
      <nav class="nav">
        <span class="nav-brand">Kviboystore</span>
        <a href="Kviboystore Katalog.dc.html">Katalog</a>
        <a href="#" aria-current="page">Pencarian</a>
        <div style="display:flex; align-items:center; gap:8px; margin-left:auto">
          <button type="button" class="btn btn-secondary btn-icon" aria-label="Ganti tema" onClick="{{ toggleTheme }}">
            <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            </sc-if>
            <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
            </sc-if>
          </button>
          <button type="button" class="btn btn-primary">Masuk</button>
        </div>
      </nav>

      <section style="max-width:1200px; margin:0 auto; padding:56px 32px">
        <h1 class="anim-rise" style="font-size:clamp(28px,4vw,44px); line-height:1.1; margin:0 0 8px; animation-delay:0.04s">Cari & filter</h1>
        <p class="anim-rise" style="font-size:15px; opacity:0.72; margin:0 0 32px; animation-delay:0.08s">{{ resultCount }} produk ditemukan</p>

        <div style="display:grid; grid-template-columns:240px 1fr; gap:32px">
          <aside style="display:flex; flex-direction:column; gap:24px">
            <div>
              <p style="font-size:12px; text-transform:uppercase; letter-spacing:0.05em; font-weight:700; margin:0 0 12px">Kategori</p>
              <div style="display:flex; flex-direction:column; gap:8px">
                <sc-for list="{{ categories }}" as="cat" hint-placeholder-count="6">
                  <label style="display:flex; gap:8px; cursor:pointer; font-size:13px">
                    <input type="checkbox" checked="{{ cat.checked }}" onChange="{{ cat.onChange }}" />
                    <span>{{ cat.label }}</span>
                  </label>
                </sc-for>
              </div>
            </div>

            <div>
              <p style="font-size:12px; text-transform:uppercase; letter-spacing:0.05em; font-weight:700; margin:0 0 12px">Harga</p>
              <input class="input" type="range" min="0" max="1000000" value="{{ priceRange }}" onInput="{{ onPriceChange }}" style="width:100%" />
              <p style="font-size:12px; opacity:0.65; margin:8px 0 0">Maks: {{ priceRangeLabel }}</p>
            </div>

            <div>
              <p style="font-size:12px; text-transform:uppercase; letter-spacing:0.05em; font-weight:700; margin:0 0 12px">Pengiriman</p>
              <div style="display:flex; flex-direction:column; gap:8px">
                <label style="display:flex; gap:8px; cursor:pointer; font-size:13px">
                  <input type="checkbox" checked="{{ instant }}" onChange="{{ onInstantChange }}" />
                  <span>Pengiriman instan</span>
                </label>
              </div>
            </div>

            <div>
              <p style="font-size:12px; text-transform:uppercase; letter-spacing:0.05em; font-weight:700; margin:0 0 12px">Rating</p>
              <div style="display:flex; flex-direction:column; gap:8px">
                <label style="display:flex; gap:8px; cursor:pointer; font-size:13px">
                  <input type="checkbox" checked="{{ rating4plus }}" onChange="{{ onRating4Change }}" />
                  <span>4★ & keatas</span>
                </label>
              </div>
            </div>

            <button type="button" class="btn btn-secondary btn-block" onClick="{{ resetFilters }}">Reset filter</button>
          </aside>

          <div>
            <div style="display:flex; gap:12px; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--color-divider)">
              <select class="input" value="{{ sortBy }}" onInput="{{ onSortChange }}" style="max-width:200px">
                <option value="newest">Terbaru</option>
                <option value="popular">Paling populer</option>
                <option value="price-asc">Harga: termurah</option>
                <option value="price-desc">Harga: termahal</option>
                <option value="rating">Rating tertinggi</option>
              </select>
            </div>

            <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
              <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px">
                <sc-for list="{{ filteredProducts }}" as="p" hint-placeholder-count="8">
                  <div class="card card-tile anim-rise" style="border:1px solid var(--color-divider); gap:0; padding:0; overflow:hidden; animation-delay:0.1s">
                    <figure class="grayscale" style="margin:0; position:relative; overflow:hidden">
                      <image-slot class="card-tile-img" id="product-search-{{ p.id }}" style="width:100%; aspect-ratio:4/3; display:block" shape="rect" placeholder="Foto produk"></image-slot>
                      <sc-if value="{{ p.platformOwned }}" hint-placeholder-val="{{ true }}">
                        <span class="tag tag-accent" style="position:absolute; top:8px; left:8px; background:#ff6b4d; color:#fff">Resmi</span>
                      </sc-if>
                    </figure>
                    <div style="padding:14px; display:flex; flex-direction:column; gap:8px; flex:1">
                      <p class="card-title" style="font-size:15px; margin:0">{{ p.title }}</p>
                      <p style="font-size:12.5px; opacity:0.65; margin:0">{{ p.type }}</p>
                      <div style="display:flex; justify-content:space-between; align-items:baseline; gap:8px">
                        <p style="font-size:16px; font-weight:800; margin:0; color:#ff6b4d">{{ p.priceLabel }}</p>
                        <span style="font-size:11px; opacity:0.65; font-weight:700">{{ p.ratingLabel }}</span>
                      </div>
                      <button type="button" class="btn btn-primary btn-block" style="margin-top:8px">Beli</button>
                    </div>
                  </div>
                </sc-for>
              </div>
            </sc-if>
            <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}">
              <div style="text-align:center; padding:64px 24px">
                <h3 style="font-size:18px; margin:0 0 8px">Tidak ada produk</h3>
                <p style="font-size:13px; opacity:0.65; margin:0">Coba ubah filter pencarian Anda.</p>
              </div>
            </sc-if>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PRODUCTS = [
  { id: "p1", title: "Streaming Video Premium 1 Bulan", type: "Streaming Video", price: 25000, category: "video", platformOwned: true, rating: null, instant: true },
  { id: "p2", title: "Streaming Musik Individual 1 Bulan", type: "Streaming Musik", price: 20000, category: "musik", platformOwned: false, rating: 4.8, instant: true },
  { id: "p3", title: "Desain Cloud Suite Tahunan", type: "Software Desain", price: 450000, category: "software", platformOwned: true, rating: null, instant: false },
  { id: "p4", title: "Cloud Storage 2TB Setahun", type: "Penyimpanan Cloud", price: 350000, category: "cloud", platformOwned: false, rating: 4.6, instant: true },
  { id: "p5", title: "VPN Premium Tahunan", type: "Keamanan & VPN", price: 180000, category: "keamanan", platformOwned: true, rating: null, instant: true },
  { id: "p6", title: "Voucher Top-Up Game", type: "Voucher Game", price: 50000, category: "game", platformOwned: false, rating: 4.9, instant: true },
  { id: "p7", title: "Lisensi Office Suite Selamanya", type: "Software Produktivitas", price: 620000, category: "software", platformOwned: true, rating: null, instant: false },
  { id: "p8", title: "Akun Family Plan Streaming", type: "Streaming Video", price: 35000, category: "video", platformOwned: false, rating: 4.7, instant: true },
];

function confirmAction(msg) { return confirm(msg); }

function formatPrice(amount) {
  return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(amount);
}

class Component extends DCLogic {
  state = {
    theme: "light",
    themeReady: false,
    selectedCategories: ["video", "musik", "software", "cloud", "keamanan", "game"],
    priceRange: 1000000,
    instant: false,
    rating4plus: false,
    sortBy: "newest",
  };

  componentDidMount() {
    try { const saved = localStorage.getItem('kviboystore_' + this.constructor.name); if (saved) this.setState(JSON.parse(saved)); } catch(e) {}
    
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ themeReady: true })));
  }

  toggleTheme = () => {
    const flip = () => this.setState((s) => ({ theme: s.theme === "dark" ? "light" : "dark" }));
    if (document.startViewTransition) document.startViewTransition(flip);
    else flip();
  };

  toggleCategory = (cat) => {
    this.setState((s) => ({
      selectedCategories: s.selectedCategories.includes(cat)
        ? s.selectedCategories.filter(c => c !== cat)
        : [...s.selectedCategories, cat],
    }));
  };

  renderVals() {
    const categories = [
      { label: "Streaming Video", cat: "video" },
      { label: "Streaming Musik", cat: "musik" },
      { label: "Software", cat: "software" },
      { label: "Cloud Storage", cat: "cloud" },
      { label: "Keamanan", cat: "keamanan" },
      { label: "Voucher Game", cat: "game" },
    ].map(c => ({
      ...c,
      checked: this.state.selectedCategories.includes(c.cat),
      onChange: () => this.toggleCategory(c.cat),
    }));

    let filtered = PRODUCTS.filter(p =>
      this.state.selectedCategories.includes(p.category) &&
      p.price <= this.state.priceRange &&
      (!this.state.instant || p.instant) &&
      (!this.state.rating4plus || (p.rating && p.rating >= 4))
    );

    if (this.state.sortBy === "price-asc") filtered.sort((a, b) => a.price - b.price);
    if (this.state.sortBy === "price-desc") filtered.sort((a, b) => b.price - a.price);
    if (this.state.sortBy === "rating") filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));

    const filtered_with_labels = filtered.map(p => ({
      ...p,
      priceLabel: formatPrice(p.price),
      ratingLabel: p.rating ? `${p.rating}★` : "Baru",
    }));

    return {
      theme: this.state.theme,
      themeReadyClass: this.state.themeReady ? "theme-ready" : "",
      isDark: this.state.theme === "dark",
      isLight: this.state.theme === "light",
      toggleTheme: this.toggleTheme,
      categories,
      priceRange: this.state.priceRange,
      priceRangeLabel: formatPrice(this.state.priceRange),
      onPriceChange: (e) => this.setState({ priceRange: parseInt(e.target.value) }),
      instant: this.state.instant,
      onInstantChange: (e) => this.setState({ instant: e.target.checked }),
      rating4plus: this.state.rating4plus,
      onRating4Change: (e) => this.setState({ rating4plus: e.target.checked }),
      resetFilters: () => this.setState({ selectedCategories: ["video", "musik", "software", "cloud", "keamanan", "game"], priceRange: 1000000, instant: false, rating4plus: false }),
      sortBy: this.state.sortBy,
      onSortChange: (e) => this.setState({ sortBy: e.target.value }),
      resultCount: filtered.length,
      filteredProducts: filtered_with_labels,
      hasResults: filtered.length > 0,
      noResults: filtered.length === 0,
    };
  }
}
</script>
</body>
</html>
