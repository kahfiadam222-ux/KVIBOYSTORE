<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-48d314f0-355a-4c97-840b-9cf683fad669/styles.css">
  <script src="_ds/modernist-48d314f0-355a-4c97-840b-9cf683fad669/_ds_bundle.js"></script>
  <script src="./image-slot.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    [data-theme] { --accent-ink: var(--color-accent-700); background: var(--color-bg); color: var(--color-text); min-height: 100vh; }
    [data-theme="dark"] {
      --color-bg: #17181a;
      --color-surface: #212226;
      --color-text: #f2f0ee;
      --color-divider: color-mix(in srgb, #f2f0ee 16%, transparent);
      --accent-ink: var(--color-accent-300);
    }
    [data-theme] a { color: #fff; }
    [data-theme] a:hover { color: var(--color-accent); }
    [data-theme] .input { background: var(--color-surface); color: var(--color-text); }
    [data-theme] .btn-primary { color: #fff; }
    [data-theme] .btn-secondary { color: var(--color-text); }
    [data-theme] .nav a, [data-theme] .nav .nav-brand { color: var(--color-text); opacity: 1; }
    [data-theme] .nav a:hover, [data-theme] .nav a[aria-current='page'] { color: var(--color-accent); opacity: 1; }
    [data-theme].theme-ready *, [data-theme].theme-ready *::before, [data-theme].theme-ready *::after {
      transition: background-color .55s cubic-bezier(.16,1,.3,1), color .55s cubic-bezier(.16,1,.3,1), border-color .55s cubic-bezier(.16,1,.3,1);
    }
    @keyframes riseIn { from { opacity: 0; transform: translate3d(0,14px,0); } to { opacity: 1; transform: translate3d(0,0,0); } }
    .anim-rise { opacity: 0; will-change: transform, opacity; animation: riseIn 0.6s cubic-bezier(.16,1,.3,1) forwards; }
    .card-tile { will-change: transform; transition: transform 0.35s cubic-bezier(.16,1,.3,1); border-radius: 12px; }
    .card-tile:hover { transform: translate3d(0,-4px,0); }
    .card-tile:hover .card-tile-img { transform: scale(1.045); }
    .card-tile-img { will-change: transform; transition: transform 0.45s cubic-bezier(.16,1,.3,1); }
    .btn { transition: all 0.25s cubic-bezier(.16,1,.3,1); }
    .btn:hover { transform: translateY(-1px); }
    .nav { display:none; }
    .mobile-header { display:flex; align-items:center; justify-content:space-between; gap:12px; height:56px; padding:0 16px; background:var(--color-surface); border-bottom:1px solid var(--color-divider); flex-shrink:0; }
    .mobile-header h1 { font-size:16px; font-weight:800; margin:0; }
    @media (prefers-reduced-motion: reduce) {
      .anim-rise { animation: none; opacity: 1; }
      [data-theme] *, [data-theme] *::before, [data-theme] *::after, .btn, .card-tile, .card-tile-img { transition: none !important; }
    }
  </style>
</helmet>

<div data-theme="{{ theme }}" class="{{ themeReadyClass }}">
  <div class="mobile-header">
    <h1>Kviboystore</h1>
    <div style="display:flex; gap:8px">
      <button type="button" class="btn btn-secondary btn-icon" aria-label="Ganti tema" onClick="{{ toggleTheme }}" style="width:36px; height:36px">
        <sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
        </sc-if>
        <sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </sc-if>
      </button>
      <button type="button" class="btn btn-secondary btn-icon" aria-label="Keranjang" style="width:36px; height:36px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 2-1.58l1.65-7.42H5.12"/></svg>
      </button>
    </div>
  </div>

  <section style="padding:28px 16px">
    <h2 class="anim-rise" style="font-size:clamp(22px,5vw,32px); line-height:1.1; letter-spacing:-0.02em; max-width:16ch; margin:0 0 12px; animation-delay:0.04s">Akun &amp; lisensi digital</h2>
    <p class="anim-rise" style="font-size:14px; line-height:1.55; opacity:0.72; margin:0 0 20px; animation-delay:0.12s">Marketplace streaming, produktivitas, dan software premium.</p>
    <input class="input" style="width:100%; margin-bottom:24px" type="search" placeholder="Cari produk…" value="{{ query }}" onInput="{{ onSearch }}" aria-label="Cari produk" />

    <sc-if value="{{ hasResults }}" hint-placeholder-val="{{ true }}">
      <div style="display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px">
        <sc-for list="{{ filteredProducts }}" as="p" hint-placeholder-count="6">
          <div class="card card-tile anim-rise" style="border:1px solid var(--color-divider); gap:0; padding:0; overflow:hidden; animation-delay:0.1s">
            <figure class="grayscale" style="margin:0; position:relative; overflow:hidden">
              <image-slot class="card-tile-img" id="product-mobile-{{ p.id }}" style="width:100%; aspect-ratio:4/3; display:block" shape="rect" placeholder="Foto produk"></image-slot>
              <sc-if value="{{ p.platformOwned }}" hint-placeholder-val="{{ true }}">
                <span class="tag tag-accent" style="position:absolute; top:6px; left:6px; background:#ff6b4d; color:#fff; font-size:9px">Resmi</span>
              </sc-if>
            </figure>
            <div style="padding:10px; display:flex; flex-direction:column; gap:6px; flex:1">
              <p style="font-size:13px; font-weight:700; margin:0; line-height:1.25">{{ p.title }}</p>
              <p style="font-size:11px; opacity:0.65; margin:0">{{ p.type }}</p>
              <p style="font-size:14px; font-weight:800; margin:2px 0 0; color:#ff6b4d">{{ p.priceLabel }}</p>
              <button type="button" class="btn btn-primary btn-block" style="margin-top:6px; font-size:12px; padding:6px">Beli</button>
            </div>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{ hasNoResults }}" hint-placeholder-val="{{ false }}">
      <div style="text-align:center; padding:40px 16px">
        <h3 style="font-size:16px; margin:0 0 6px">Produk tidak ditemukan</h3>
        <p style="font-size:12px; opacity:0.65; margin:0">Coba kata kunci lain.</p>
      </div>
    </sc-if>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PRODUCTS = [
  { id: "p1", title: "Streaming Video Premium 1 Bulan", type: "Streaming Video", price: 25000, stock: 12, delivery: "shared_account", platformOwned: true, rating: null },
  { id: "p2", title: "Streaming Musik Individual 1 Bulan", type: "Streaming Musik", price: 20000, stock: 3, delivery: "private_account", platformOwned: false, rating: 4.8 },
  { id: "p3", title: "Desain Cloud Suite Tahunan", type: "Software Desain", price: 450000, stock: 8, delivery: "license_key", platformOwned: true, rating: null },
  { id: "p4", title: "Cloud Storage 2TB Setahun", type: "Penyimpanan Cloud", price: 350000, stock: 20, delivery: "voucher", platformOwned: false, rating: 4.6 },
  { id: "p5", title: "VPN Premium Tahunan", type: "Keamanan & VPN", price: 180000, stock: 15, delivery: "redeem_code", platformOwned: true, rating: null },
  { id: "p6", title: "Voucher Top-Up Game", type: "Voucher Game", price: 50000, stock: 2, delivery: "voucher", platformOwned: false, rating: 4.9 },
];

function formatPrice(amount) {
  return new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(amount);
}

class Component extends DCLogic {
  state = { query: "", theme: "light", themeReady: false };

  componentDidMount() {
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ themeReady: true })));
  }

  toggleTheme = () => {
    const flip = () => this.setState((s) => ({ theme: s.theme === "dark" ? "light" : "dark" }));
    if (document.startViewTransition) document.startViewTransition(flip);
    else flip();
  };

  renderVals() {
    const query = this.state.query;
    const q = query.trim().toLowerCase();
    const filtered = PRODUCTS.filter((p) =>
      !q || p.title.toLowerCase().includes(q) || p.type.toLowerCase().includes(q)
    ).map((p) => ({
      ...p,
      priceLabel: formatPrice(p.price),
    }));

    return {
      query,
      onSearch: (e) => this.setState({ query: e.target.value }),
      theme: this.state.theme,
      themeReadyClass: this.state.themeReady ? "theme-ready" : "",
      isDark: this.state.theme === "dark",
      isLight: this.state.theme === "light",
      toggleTheme: this.toggleTheme,
      filteredProducts: filtered,
      hasResults: filtered.length > 0,
      hasNoResults: filtered.length === 0,
    };
  }
}
</script>
</body>
</html>
