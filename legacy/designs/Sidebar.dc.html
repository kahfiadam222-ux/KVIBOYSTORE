<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-48d314f0-355a-4c97-840b-9cf683fad669/styles.css">
  <script src="_ds/modernist-48d314f0-355a-4c97-840b-9cf683fad669/_ds_bundle.js"></script>
  <style>
    @keyframes sbIn { from { opacity: 0; transform: translate3d(-8px,0,0); } to { opacity: 1; transform: none; } }
    aside .sb-item, aside .sb-cat { color: var(--color-text); }
    .sb-item { position: relative; display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 12px; text-decoration: none; color: inherit; cursor: pointer; border: 0; background: transparent; width: 100%; font-size: 13px; font-family: inherit; text-align: left; opacity: 0; animation: sbIn .45s cubic-bezier(.16,1,.3,1) forwards; transition: background-color 0.25s cubic-bezier(.16,1,.3,1), color 0.25s cubic-bezier(.16,1,.3,1); }
    .sb-item:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
    .sb-item[data-active="true"] { font-weight: 800; }
    .sb-item[data-active="true"]::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; background: var(--color-accent); }
    .sb-item[data-active="true"] svg { color: var(--color-accent); }
    .sb-cat { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; font-size: 12px; text-decoration: none; color: inherit; opacity: 0; animation: sbIn .45s cubic-bezier(.16,1,.3,1) forwards; transition: background-color 0.25s cubic-bezier(.16,1,.3,1); }
    .sb-cat:hover { background: color-mix(in srgb, currentColor 8%, transparent); }
    .sb-label { display: block; padding: 0 12px; margin-bottom: 8px; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.5; }
    @media (prefers-reduced-motion: reduce) { .sb-item, .sb-cat { animation: none; opacity: 1; } }
  </style>
</helmet>

<aside style="{{ railStyle }}">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; height:60px; padding:0 12px; border-bottom:2px solid var(--color-divider); flex-shrink:0">
    <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
      <a href="#beranda" style="font-family:var(--font-heading); font-weight:800; font-size:15px; text-decoration:none; color:inherit">Kviboystore</a>
    </sc-if>
    <button type="button" class="btn btn-secondary btn-icon" aria-label="Ciutkan sidebar" onClick="{{ toggleCollapsed }}" style="width:32px; height:32px; flex-shrink:0">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="{{ chevronStyle }}"><path d="m15 18-6-6 6-6"/></svg>
    </button>
  </div>

  <div style="flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; padding:16px 0 24px">
    <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
      <span class="sb-label">Menu</span>
    </sc-if>
    <sc-for list="{{ menuItems }}" as="it" hint-placeholder-count="4">
      <a class="sb-item" href="{{ it.href }}" data-active="{{ it.active }}" title="{{ it.label }}" style="{{ it.style }}">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; opacity:0.85"><path d="{{ it.icon }}"/><path d="{{ it.icon2 }}"/></svg>
        <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}"><span style="white-space:nowrap">{{ it.label }}</span></sc-if>
      </a>
    </sc-for>

    <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
      <span class="sb-label" style="margin-top:24px">Kategori</span>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:0 8px">
        <sc-for list="{{ categories }}" as="cat" hint-placeholder-count="8">
          <a class="sb-cat" href="#produk" style="{{ cat.style }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; opacity:0.7"><path d="{{ cat.icon }}"/><path d="{{ cat.icon2 }}"/></svg>
            <span style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{ cat.label }}</span>
          </a>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ showAdmin }}" hint-placeholder-val="{{ false }}">
      <div style="margin-top:24px">
        <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
          <span class="sb-label" style="color:var(--color-accent); opacity:0.9">Admin</span>
        </sc-if>
        <sc-for list="{{ adminItems }}" as="it" hint-placeholder-count="6">
          <a class="sb-item" href="{{ it.href }}" data-active="{{ it.active }}" title="{{ it.label }}" style="{{ it.style }}">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; opacity:0.85"><path d="{{ it.icon }}"/><path d="{{ it.icon2 }}"/></svg>
            <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}"><span style="white-space:nowrap">{{ it.label }}</span></sc-if>
          </a>
        </sc-for>
        <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
          <div style="padding:8px 12px 0">
            <a href="#promo" class="btn btn-primary btn-block" style="margin-top:0">Panel konten</a>
          </div>
        </sc-if>
      </div>
    </sc-if>

    <div style="margin-top:24px">
      <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
        <span class="sb-label">Aksi</span>
      </sc-if>
      <sc-for list="{{ actionItems }}" as="it" hint-placeholder-count="4">
        <a class="sb-item" href="{{ it.href }}" title="{{ it.label }}" style="{{ it.style }}">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; opacity:0.85"><path d="{{ it.icon }}"/><path d="{{ it.icon2 }}"/></svg>
          <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}"><span style="white-space:nowrap">{{ it.label }}</span></sc-if>
        </a>
      </sc-for>
    </div>
  </div>

  <sc-if value="{{ expanded }}" hint-placeholder-val="{{ true }}">
    <div style="flex-shrink:0; border-top:2px solid var(--color-divider); padding:12px; display:flex; align-items:center; gap:10px">
      <span style="display:flex; width:30px; height:30px; align-items:center; justify-content:center; background:color-mix(in srgb, currentColor 10%, transparent); flex-shrink:0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"/></svg>
      </span>
      <span style="min-width:0">
        <span style="display:block; font-size:12px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{ userEmail }}</span>
        <span style="display:block; font-size:10px; opacity:0.55; text-transform:capitalize">{{ userRole }}</span>
      </span>
    </div>
  </sc-if>
</aside>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:236,&quot;height&quot;:720},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;beranda&quot;,&quot;options&quot;:[&quot;beranda&quot;,&quot;pesanan&quot;,&quot;wishlist&quot;,&quot;keranjang&quot;,&quot;partners&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;isAdminUser&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;userEmail&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;kahfiadam222@gmail.com&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const I = {
  home: ["M3 10.6 12 3l9 7.6V21H3z", "M9.5 21v-7h5v7"],
  orders: ["M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z", "M3 7.5 12 12l9-4.5M12 12v9"],
  heart: ["M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z", ""],
  cart: ["M2 3h2.2l2.6 12.4a2 2 0 0 0 2 1.6h9.6a2 2 0 0 0 2-1.6L22 7H5.2", "M8.5 21h.01M18 21h.01"],
  tv: ["M2 7.5h20V19H2z", "m7 3.5 5 4 5-4"],
  music: ["M9 18.5V5l12-2.2V16", "M6 21.5a3 3 0 1 0 3-3M18 19a3 3 0 1 0 3-3"],
  palette: ["M12 3a9 9 0 1 0 0 18h2.2a2.8 2.8 0 0 0 0-5.6h-1.1a2 2 0 0 1 0-4H16a5 5 0 0 0-4-8.4z", "M7.5 10h.01M10 6.5h.01M15 6.5h.01"],
  bot: ["M4.5 8.5h15V20h-15z", "M12 4.5v4M8.5 13.5h.01M15.5 13.5h.01"],
  shield: ["M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z", "m9 12 2 2 4-4"],
  file: ["M14 2H6v20h12V8z", "M14 2v6h6"],
  gift: ["M3 10.5h18V21H3z", "M12 10.5V21M3 10.5l2-4.5h5l2 4.5 2-4.5h5l2 4.5"],
  game: ["M6.5 9h11a4.5 4.5 0 0 1 0 9h-11a4.5 4.5 0 0 1 0-9z", "M9 12v3M7.5 13.5h3M16 12.5h.01M18 15h.01"],
  image: ["M3 4.5h18v15H3z", "m3 16 5-5 4 4 3-3 6 6"],
  tags: ["m3 3.5 8.5 0 9 9-8.5 8.5-9-9z", "M7.5 8h.01"],
  users: ["M16 20.5v-2a4 4 0 0 0-4-4H6.5a4 4 0 0 0-4 4v2", "M9.2 10.5a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM21.5 20.5v-2a4 4 0 0 0-3-3.9"],
  box: ["M3.5 8 12 3.5 20.5 8v8L12 20.5 3.5 16z", "M3.5 8 12 12.5 20.5 8"],
  alert: ["m12 3.2 9.5 17.3H2.5z", "M12 9.5v5M12 18h.01"],
  store: ["M3.5 9.5h17V20h-17z", "M2.5 9.5 4.5 4h15l2 5.5z"],
  card: ["M2.5 6h19v12h-19z", "M2.5 10h19"],
  help: ["M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z", "M9.6 9.2a2.6 2.6 0 0 1 5 .9c0 2-2.6 2.1-2.6 4M12 17.8h.01"],
};

const CATEGORIES = [
  ["Streaming", "tv"], ["Musik", "music"], ["Desain", "palette"], ["AI Tools", "bot"],
  ["Keamanan", "shield"], ["E-book", "file"], ["Voucher", "gift"], ["Game", "game"],
];

const MENU = [
  ["Beranda", "beranda", "#beranda", "home"],
  ["Pesanan Saya", "pesanan", "#pesanan", "orders"],
  ["Wishlist", "wishlist", "#wishlist", "heart"],
  ["Keranjang", "keranjang", "#keranjang", "cart"],
];

const ADMIN = [
  ["Konten beranda", "#promo", "image"],
  ["Kategori sidebar", "#produk", "tags"],
  ["Jenis produk", "#produk", "box"],
  ["Penjual", "#produk", "users"],
  ["Stok jualan", "#produk", "box"],
  ["Sengketa", "#produk", "alert"],
];

const ACTIONS = [
  ["Jadi Penjual", "#partners", "store"],
  ["Top Up Saldo", "#promo", "card"],
  ["Promo & Diskon", "#promo", "gift"],
  ["Bantuan", "#produk", "help"],
];

class Component extends DCLogic {
  state = { collapsed: false };

  toggleCollapsed = () => this.setState((s) => ({ collapsed: !s.collapsed }));

  renderVals() {
    const collapsed = this.state.collapsed;
    const active = this.props.active ?? "beranda";
    const showAdmin = !!this.props.isAdminUser;
    const delay = (i) => "animation-delay:" + (0.03 * i).toFixed(2) + "s";

    return {
      expanded: !collapsed,
      toggleCollapsed: this.toggleCollapsed,
      showAdmin,
      railStyle: [
        "display:flex; flex-direction:column; flex-shrink:0; align-self:stretch",
        "min-height:100vh; overflow:hidden; background:var(--color-surface)",
        "border-right:1px solid color-mix(in srgb, var(--color-text) 10%, transparent)",
        "box-shadow:14px 0 28px -22px color-mix(in srgb, var(--color-text) 60%, transparent)",
        "transition:width .35s cubic-bezier(.16,1,.3,1)",
        "width:" + (collapsed ? "64px" : "236px"),
      ].join("; "),
      chevronStyle: collapsed ? "transform:rotate(180deg); transition:transform .35s cubic-bezier(.16,1,.3,1)" : "transition:transform .35s cubic-bezier(.16,1,.3,1)",
      menuItems: MENU.map(([label, key, href, icon], i) => ({
        label, href, active: active === key ? "true" : "false",
        icon: I[icon][0], icon2: I[icon][1], style: delay(i),
      })),
      categories: CATEGORIES.map(([label, icon], i) => ({
        label, icon: I[icon][0], icon2: I[icon][1], style: delay(4 + i),
      })),
      adminItems: ADMIN.map(([label, href, icon], i) => ({
        label, href, active: "false", icon: I[icon][0], icon2: I[icon][1], style: delay(12 + i),
      })),
      actionItems: ACTIONS.map(([label, href, icon], i) => ({
        label, href, icon: I[icon][0], icon2: I[icon][1], style: delay((showAdmin ? 18 : 12) + i),
      })),
      userEmail: this.props.userEmail ?? "admin@kviboystore.id",
      userRole: showAdmin ? "admin" : "buyer",
    };
  }
}

</script>
</body>
</html>
