<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-48d314f0-355a-4c97-840b-9cf683fad669/styles.css">
  <script src="_ds/modernist-48d314f0-355a-4c97-840b-9cf683fad669/_ds_bundle.js"></script>
  <style>
    [data-theme] { --accent-ink: var(--color-accent-700); background: var(--color-bg); color: var(--color-text); min-height: 100vh; }
    [data-theme="dark"] { --color-bg: #17181a; --color-surface: #212226; --color-text: #f2f0ee; --color-divider: color-mix(in srgb, #f2f0ee 16%, transparent); --accent-ink: var(--color-accent-300); }
    [data-theme] a { color: #fff; }
    [data-theme] a:hover { color: var(--color-accent); }
    [data-theme] .input { background: var(--color-surface); color: var(--color-text); }
    [data-theme] .btn-primary { color: #fff; }
    [data-theme] .btn-secondary { color: var(--color-text); }
    [data-theme] .nav a, [data-theme] .nav .nav-brand { color: var(--color-text); opacity: 1; }
    [data-theme] .nav a:hover, [data-theme] .nav a[aria-current='page'] { color: var(--color-accent); opacity: 1; }
    [data-theme].theme-ready *, [data-theme].theme-ready *::before, [data-theme].theme-ready *::after { transition: background-color .55s cubic-bezier(.16,1,.3,1), color .55s cubic-bezier(.16,1,.3,1), border-color .55s cubic-bezier(.16,1,.3,1); }
    @keyframes riseIn { from { opacity: 0; transform: translate3d(0,14px,0); } to { opacity: 1; transform: translate3d(0,0,0); } }
    .anim-rise { opacity: 0; will-change: transform, opacity; animation: riseIn 0.6s cubic-bezier(.16,1,.3,1) forwards; }
    .btn { transition: all 0.25s cubic-bezier(.16,1,.3,1); }
    .btn:hover { transform: translateY(-1px); }
    .error { color: #ff6b4d; font-size: 13px; margin-top: 4px; }
    @media (prefers-reduced-motion: reduce) {
      .anim-rise { animation: none; opacity: 1; }
      [data-theme] *, [data-theme] *::before, [data-theme] *::after, .btn { transition: none !important; }
    }
  </style>
</helmet>

<div data-theme="{{ theme }}" class="{{ themeReadyClass }}" style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px">
  <div style="width:100%; max-width:420px">
    <div class="anim-rise" style="margin-bottom:40px; text-align:center; animation-delay:0.04s">
      <h1 style="font-size:32px; font-weight:800; margin:0 0 8px">Masuk</h1>
      <p style="font-size:14px; opacity:0.72; margin:0">Belanja produk digital terbaik dengan aman</p>
    </div>

    <form style="display:flex; flex-direction:column; gap:16px" onSubmit="{{ handleSubmit }}">
      <div class="anim-rise" style="animation-delay:0.08s">
        <label style="display:block; font-size:12px; font-weight:700; margin:0 0 6px">Email</label>
        <input class="input" type="email" value="{{ email }}" onInput="{{ onEmailChange }}" placeholder="nama@example.com" required />
        <sc-if value="{{ emailError }}" hint-placeholder-val="{{ false }}">
          <div class="error">{{ emailError }}</div>
        </sc-if>
      </div>

      <div class="anim-rise" style="animation-delay:0.12s">
        <label style="display:block; font-size:12px; font-weight:700; margin:0 0 6px">Password</label>
        <input class="input" type="password" value="{{ password }}" onInput="{{ onPasswordChange }}" placeholder="••••••••" required />
        <sc-if value="{{ passwordError }}" hint-placeholder-val="{{ false }}">
          <div class="error">{{ passwordError }}</div>
        </sc-if>
      </div>

      <sc-if value="{{ generalError }}" hint-placeholder-val="{{ false }}">
        <div style="background:#ff6b4d; color:#fff; padding:12px; border-radius:6px; font-size:13px">{{ generalError }}</div>
      </sc-if>

      <button type="submit" class="btn btn-primary btn-block anim-rise" style="margin-top:8px; animation-delay:0.16s" {{ submitDisabled }}>
        {{ submitLabel }}
      </button>
    </form>

    <div class="anim-rise" style="text-align:center; margin-top:24px; animation-delay:0.2s">
      <p style="font-size:13px; margin:0 0 12px">Belum punya akun? <a href="Kviboystore Signup.dc.html" style="color:var(--color-accent); text-decoration:none; font-weight:700">Daftar sekarang</a></p>
      <a href="#" style="font-size:12px; opacity:0.65; text-decoration:none">Lupa password?</a>
    </div>

    <div style="display:flex; gap:12px; margin-top:32px; align-items:center">
      <hr class="hr" style="flex:1" />
      <span style="font-size:12px; opacity:0.65">atau</span>
      <hr class="hr" style="flex:1" />
    </div>

    <div style="display:flex; flex-direction:column; gap:12px; margin-top:20px">
      <button type="button" class="btn btn-secondary btn-block anim-rise" style="animation-delay:0.24s">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right:8px"><path d="M12.545,10.852v3.608h5.337c-0.676,1.290-2.129,2.161-4.040,2.161c-2.289,0-4.131-1.528-4.131-3.413 c0-1.885,1.842-3.413,4.131-3.413c1.015,0,1.957,0.361,2.679,0.948l2.586-2.567c-1.435-1.335-3.326-2.157-5.265-2.157 c-4.344,0-7.882,3.522-7.882,7.874c0,4.352,3.537,7.874,7.882,7.874c3.996,0,7.409-2.905,8.236-6.857H12.545V10.852z"/></svg>
        Lanjut dengan Google
      </button>
      <button type="button" class="btn btn-secondary btn-block anim-rise" style="animation-delay:0.28s">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="margin-right:8px"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        Lanjut dengan Facebook
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    theme: "light",
    themeReady: false,
    email: "",
    password: "",
    loading: false,
    emailError: "",
    passwordError: "",
    generalError: "",
  };

  componentDidMount() {
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ themeReady: true })));
  }

  validateEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  handleSubmit = async (e) => {
    e.preventDefault();

    let hasError = false;
    const newErrors = { emailError: "", passwordError: "", generalError: "" };

    if (!this.validateEmail(this.state.email)) {
      newErrors.emailError = "Email tidak valid";
      hasError = true;
    }

    if (this.state.password.length < 6) {
      newErrors.passwordError = "Password minimal 6 karakter";
      hasError = true;
    }

    if (hasError) {
      this.setState(newErrors);
      return;
    }

    this.setState({ loading: true, ...newErrors });

    try {
      const supabaseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;
      const supabaseKey = process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY;

      if (!supabaseUrl || !supabaseKey) {
        this.setState({ generalError: "Configuration error", loading: false });
        return;
      }

      const res = await fetch(`${supabaseUrl}/auth/v1/token?grant_type=password`, {
        method: "POST",
        headers: {
          "apikey": supabaseKey,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          email: this.state.email,
          password: this.state.password,
        }),
      });

      if (!res.ok) {
        const error = await res.json();
        this.setState({ generalError: error.error_description || "Login gagal", loading: false });
        return;
      }

      const data = await res.json();
      localStorage.setItem("auth_token", data.access_token);
      localStorage.setItem("auth_user", JSON.stringify(data.user));

      // Redirect to home
      window.location.href = "/";
    } catch (err) {
      this.setState({ generalError: err.message, loading: false });
    }
  };

  renderVals() {
    return {
      theme: this.state.theme,
      themeReadyClass: this.state.themeReady ? "theme-ready" : "",
      email: this.state.email,
      onEmailChange: (e) => this.setState({ email: e.target.value }),
      password: this.state.password,
      onPasswordChange: (e) => this.setState({ password: e.target.value }),
      emailError: this.state.emailError,
      passwordError: this.state.passwordError,
      generalError: this.state.generalError,
      handleSubmit: this.handleSubmit,
      submitDisabled: this.state.loading ? "disabled" : "",
      submitLabel: this.state.loading ? "Masuk..." : "Masuk",
    };
  }
}
</script>
</body>
</html>
