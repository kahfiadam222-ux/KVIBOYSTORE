<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/modernist-48d314f0-355a-4c97-840b-9cf683fad669/styles.css">
  <script src="_ds/modernist-48d314f0-355a-4c97-840b-9cf683fad669/_ds_bundle.js"></script>
  <style>
    [data-theme] { --accent-ink: var(--color-accent-700); background: var(--color-bg); color: var(--color-text); min-height: 100vh; }
    [data-theme="dark"] { --color-bg: #17181a; --color-surface: #212226; --color-text: #f2f0ee; --color-divider: color-mix(in srgb, #f2f0ee 16%, transparent); --accent-ink: var(--color-accent-300); }
    [data-theme] a { color: #fff; }
    [data-theme] a:hover { color: var(--color-accent); }
    [data-theme] .input { background: var(--color-surface); color: var(--color-text); }
    [data-theme] .btn-primary { color: #fff; }
    [data-theme] .btn-secondary { color: var(--color-text); }
    [data-theme] .nav a, [data-theme] .nav .nav-brand { color: var(--color-text); opacity: 1; }
    [data-theme] .nav a:hover, [data-theme] .nav a[aria-current='page'] { color: var(--color-accent); opacity: 1; }
    [data-theme].theme-ready *, [data-theme].theme-ready *::before, [data-theme].theme-ready *::after { transition: background-color .55s cubic-bezier(.16,1,.3,1), color .55s cubic-bezier(.16,1,.3,1), border-color .55s cubic-bezier(.16,1,.3,1); }
    @keyframes riseIn { from { opacity: 0; transform: translate3d(0,14px,0); } to { opacity: 1; transform: translate3d(0,0,0); } }
    .anim-rise { opacity: 0; will-change: transform, opacity; animation: riseIn 0.6s cubic-bezier(.16,1,.3,1) forwards; }
    .btn { transition: all 0.25s cubic-bezier(.16,1,.3,1); }
    .btn:hover { transform: translateY(-1px); }
    .error { color: #ff6b4d; font-size: 13px; margin-top: 4px; }
    .success { color: #4ade80; font-size: 13px; margin-top: 4px; }
    @media (prefers-reduced-motion: reduce) {
      .anim-rise { animation: none; opacity: 1; }
      [data-theme] *, [data-theme] *::before, [data-theme] *::after, .btn { transition: none !important; }
    }
  </style>
</helmet>

<div data-theme="{{ theme }}" class="{{ themeReadyClass }}" style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px">
  <div style="width:100%; max-width:420px">
    <div class="anim-rise" style="margin-bottom:32px; text-align:center; animation-delay:0.04s">
      <h1 style="font-size:32px; font-weight:800; margin:0 0 8px">Daftar akun</h1>
      <p style="font-size:14px; opacity:0.72; margin:0">Mulai belanja produk digital premium hari ini</p>
    </div>

    <form style="display:flex; flex-direction:column; gap:16px" onSubmit="{{ handleSubmit }}">
      <div class="anim-rise" style="animation-delay:0.08s">
        <label style="display:block; font-size:12px; font-weight:700; margin:0 0 6px">Email</label>
        <input class="input" type="email" value="{{ email }}" onInput="{{ onEmailChange }}" placeholder="nama@example.com" required />
        <sc-if value="{{ emailError }}" hint-placeholder-val="{{ false }}">
          <div class="error">{{ emailError }}</div>
        </sc-if>
      </div>

      <div class="anim-rise" style="animation-delay:0.12s">
        <label style="display:block; font-size:12px; font-weight:700; margin:0 0 6px">Password</label>
        <input class="input" type="password" value="{{ password }}" onInput="{{ onPasswordChange }}" placeholder="Minimal 8 karakter" required />
        <sc-if value="{{ passwordError }}" hint-placeholder-val="{{ false }}">
          <div class="error">{{ passwordError }}</div>
        </sc-if>
      </div>

      <div class="anim-rise" style="animation-delay:0.16s">
        <label style="display:block; font-size:12px; font-weight:700; margin:0 0 6px">Konfirmasi password</label>
        <input class="input" type="password" value="{{ passwordConfirm }}" onInput="{{ onPasswordConfirmChange }}" placeholder="Ulangi password" required />
        <sc-if value="{{ confirmError }}" hint-placeholder-val="{{ false }}">
          <div class="error">{{ confirmError }}</div>
        </sc-if>
      </div>

      <div class="anim-rise" style="display:flex; gap:8px; align-items:flex-start; animation-delay:0.2s">
        <input type="checkbox" id="terms" checked="{{ agreeTerms }}" onChange="{{ onTermsChange }}" style="margin-top:4px" required />
        <label for="terms" style="font-size:12px; opacity:0.72; line-height:1.5">Saya setuju dengan <a href="#" style="color:var(--color-accent); text-decoration:none">Syarat & Ketentuan</a> dan <a href="#" style="color:var(--color-accent); text-decoration:none">Kebijakan Privasi</a></label>
      </div>

      <sc-if value="{{ generalError }}" hint-placeholder-val="{{ false }}">
        <div style="background:#ff6b4d; color:#fff; padding:12px; border-radius:6px; font-size:13px">{{ generalError }}</div>
      </sc-if>

      <button type="submit" class="btn btn-primary btn-block anim-rise" style="margin-top:8px; animation-delay:0.24s" {{ submitDisabled }}>
        {{ submitLabel }}
      </button>
    </form>

    <div class="anim-rise" style="text-align:center; margin-top:24px; animation-delay:0.28s">
      <p style="font-size:13px; margin:0">Sudah punya akun? <a href="Kviboystore Login.dc.html" style="color:var(--color-accent); text-decoration:none; font-weight:700">Masuk sekarang</a></p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = {
    theme: "light",
    themeReady: false,
    email: "",
    password: "",
    passwordConfirm: "",
    agreeTerms: false,
    loading: false,
    emailError: "",
    passwordError: "",
    confirmError: "",
    generalError: "",
  };

  componentDidMount() {
    requestAnimationFrame(() => requestAnimationFrame(() => this.setState({ themeReady: true })));
  }

  validateEmail = (email) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

  handleSubmit = async (e) => {
    e.preventDefault();

    let hasError = false;
    const newErrors = { emailError: "", passwordError: "", confirmError: "", generalError: "" };

    if (!this.validateEmail(this.state.email)) {
      newErrors.emailError = "Email tidak valid";
      hasError = true;
    }

    if (this.state.password.length < 8) {
      newErrors.passwordError = "Password minimal 8 karakter";
      hasError = true;
    }

    if (this.state.password !== this.state.passwordConfirm) {
      newErrors.confirmError = "Password tidak cocok";
      hasError = true;
    }

    if (!this.state.agreeTerms) {
      newErrors.generalError = "Setujui syarat & ketentuan untuk melanjutkan";
      hasError = true;
    }

    if (hasError) {
      this.setState(newErrors);
      return;
    }

    this.setState({ loading: true, ...newErrors });

    try {
      const supabaseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL;
      const supabaseKey = process.env.NEXT_PUBLIC_SUPABASE_ANON_KEY;

      if (!supabaseUrl || !supabaseKey) {
        this.setState({ generalError: "Configuration error", loading: false });
        return;
      }

      const res = await fetch(`${supabaseUrl}/auth/v1/signup`, {
        method: "POST",
        headers: {
          "apikey": supabaseKey,
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          email: this.state.email,
          password: this.state.password,
        }),
      });

      if (!res.ok) {
        const error = await res.json();
        this.setState({ generalError: error.error_description || "Pendaftaran gagal", loading: false });
        return;
      }

      const data = await res.json();
      localStorage.setItem("auth_token", data.session?.access_token);
      localStorage.setItem("auth_user", JSON.stringify(data.user));

      // Redirect to email verification or home
      window.location.href = "/check-email";
    } catch (err) {
      this.setState({ generalError: err.message, loading: false });
    }
  };

  renderVals() {
    return {
      theme: this.state.theme,
      themeReadyClass: this.state.themeReady ? "theme-ready" : "",
      email: this.state.email,
      onEmailChange: (e) => this.setState({ email: e.target.value }),
      password: this.state.password,
      onPasswordChange: (e) => this.setState({ password: e.target.value }),
      passwordConfirm: this.state.passwordConfirm,
      onPasswordConfirmChange: (e) => this.setState({ passwordConfirm: e.target.value }),
      agreeTerms: this.state.agreeTerms,
      onTermsChange: (e) => this.setState({ agreeTerms: e.target.checked }),
      emailError: this.state.emailError,
      passwordError: this.state.passwordError,
      confirmError: this.state.confirmError,
      generalError: this.state.generalError,
      handleSubmit: this.handleSubmit,
      submitDisabled: this.state.loading ? "disabled" : "",
      submitLabel: this.state.loading ? "Mendaftar..." : "Daftar akun",
    };
  }
}
</script>
</body>
</html>
